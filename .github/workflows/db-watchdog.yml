name: DB watchdog

# Checks the Supabase project every ~5 min and restarts it on a sustained
# outage. No notifications are sent anywhere; see ops/db-watchdog.md.
#
# `schedule` is kept as a free extra chance, but GitHub's cron trigger has
# been observed to fire only sporadically for this repo (hours between
# fires instead of ~5 min) rather than just occasionally-delayed, so the
# last step below makes each run re-dispatch the next one via
# workflow_dispatch - a self-sustaining chain, same pattern already used by
# .github/workflows/worker.yml upstream. If the chain ever breaks (a commit
# makes the job fail before that step, Actions gets disabled, etc.) nothing
# else restarts it - kick it off again with a manual workflow_dispatch.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the restart decision but never call the restart API
        type: boolean
        default: false
      simulate_fail:
        description: Force every check to report failure (for testing the restart branch)
        type: boolean
        default: false

concurrency:
  group: db-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch watchdog script
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/db_watchdog.py
          sparse-checkout-cone-mode: false
      - name: Check project health and restart if needed
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SIMULATE_FAIL: ${{ github.event.inputs.simulate_fail || 'false' }}
        run: python3 scripts/db_watchdog.py
      # open-worker.yml's own `schedule` did not fire once in its first 2.5 h (2026-10-13), so this
      # chain - which does run every few minutes - starts it: when the open track is on, no open-worker
      # run is queued or running, and the last one started 25+ minutes ago. The worker exits when the
      # queue is idle, so a submission waits at most ~30 min. Never fails the watchdog.
      - name: Kick the open-track worker (fallback for its unreliable schedule)
        if: always() && vars.OPEN_TRACK_ENABLED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow open-worker.yml --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow open-worker.yml --limit 1 \
            --json createdAt --jq '.[0].createdAt // ""')
          age=999999
          if [ -n "$last" ]; then age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) )); fi
          echo "open-worker: active=$active last_start_age=${age}s"
          if [ "$active" = "0" ] && [ "$age" -ge 1500 ]; then
            gh workflow run open-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "dispatched open-worker"
          fi
      - name: Kick the site patrol (fallback for its unreliable schedule)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow site-patrol.yml --limit 10 \
            --json createdAt,event --jq '[.[] | select(.event != "pull_request")][0].createdAt // ""')
          age=999999
          if [ -n "$last" ]; then age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) )); fi
          echo "site-patrol: last_start_age=${age}s"
          if [ "$age" -ge 10800 ]; then
            gh workflow run site-patrol.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "dispatched site-patrol"
          fi
      - name: Self-redispatch (fallback for an unreliable schedule trigger)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run db-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
