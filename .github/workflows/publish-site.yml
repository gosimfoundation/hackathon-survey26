name: Publish event site

on:
  pull_request:
  workflow_dispatch:
  # Publish only after the Tests workflow has completed successfully on main.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: event-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Skip the whole pipeline when Tests finished with anything but success.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            legacy-event/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix legacy-event
      - name: Build and package
        run: node scripts/release-site.mjs
        env:
          # Public client settings are repository variables so fork PR builds work too.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v6
        with:
          name: event-site
          path: release/
          retention-days: 14
  publish:
    # Only a green Tests run on main (or a manual dispatch from main) publishes.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: event-site
          path: release
      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="site-${REVISION}-${RUN_ID}-${ATTEMPT}"
          gh release create "$tag" release/site.tar.gz release/site.tar.gz.sha256 \
            --draft --target "$REVISION" --title "Website ${REVISION:0:12}" \
            --notes "Successful website build. The shared create.gosim.org publisher collects this release automatically."
          gh release edit "$tag" --draft=false --latest
